<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b5c">
<meta name="description" content="אלבום מעקב לאוסף מטבעות: מה יש, מה חסר, וצילום כל מטבע">
<title>אלבום מטבעות</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div class="hero-title">
        <span class="eyebrow">אלבום אספן · נשמר בטלפון</span>
        <h1>אלבום המטבעות שלי</h1>
      </div>
      <div class="top-actions">
        <button class="btn gold" id="addBtn" type="button">+ הוסף מטבע</button>
        <button class="btn ghost icon" id="menuBtn" type="button" aria-label="גיבוי והגדרות">⋯</button>
      </div>
    </div>
    <div class="hero-stats" id="stats"></div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="toolbar">
    <div class="viewtoggle" role="group" aria-label="תצוגה">
      <button class="vt" data-v="album" aria-pressed="true" type="button">אלבום</button>
      <button class="vt" data-v="list" aria-pressed="false" type="button">רשימה</button>
    </div>
    <button class="btn customize" id="customizeBtn" type="button" hidden>✎ התאמת האלבום</button>
    <div class="chips" role="group" aria-label="סינון">
      <button class="chip" data-f="all" aria-pressed="true" type="button">הכול</button>
      <button class="chip" data-f="own" aria-pressed="false" type="button">יש לי</button>
      <button class="chip" data-f="miss" aria-pressed="false" type="button">חסר לי</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <section id="view" aria-live="polite"></section>
</div>

<div id="reader" hidden>
  <div class="reader-stage" id="readerStage"></div>
  <button class="reader-x" id="readerClose" type="button" aria-label="יציאה ממסך מלא">✕</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<dialog id="adder"><div class="sheet" id="adderBody"></div></dialog>
<dialog id="menu"><div class="sheet" id="menuBody"></div></dialog>
<dialog id="lightbox" aria-label="תמונת המטבע"><div id="lightboxBody"></div></dialog>
<dialog id="cropper"><div class="sheet" id="cropperBody"></div></dialog>

<script src="catalog.js"></script>
<script src="store.js"></script>
<script src="photo.js"></script>
<script src="app.js"></script>
</body>
</html>
